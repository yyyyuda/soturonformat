<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>LaTeXファイルダウンロード</title>
</head>
<body>

<!-- ダウンロードボタン -->
<button id="downloadBtn">LaTeXファイルをダウンロード</button>

<script>
document.getElementById('downloadBtn').addEventListener('click', function() {
  
  // LaTeXの内容を文字列で作る
  const latexContent = `
\\documentclass{article}
\\begin{document}
これはサンプルのLaTeXドキュメントです。
\\end{document}
  `.trim();

  // Blob：文字列をファイルとして出力できる形式にする、latexContentが文字列、text/plainはファイルの形式
  const blob = new Blob([latexContent], { type: 'text/plain' });

  // ダウンロードリンクを作成して自動クリック
  //仮想的にaタグの要素を作る
  const link = document.createElement('a');
  //aタグのリンク先にblobオブジェクトをURLとして変換する
  link.href = URL.createObjectURL(blob);
  //ダウンロードするときの名前、download属性に値を入れる
  link.download = 'sample.tex'; 
  //子であるaタグをbodyに一時的に追加する
  document.body.appendChild(link);
  //javascriptで自動的にクリック
  link.click();
  //bodyから子の要素を消す
  document.body.removeChild(link);
  // URLを解放してメモリ節約
  URL.revokeObjectURL(link.href);
});
</script>

</body>
</html>
