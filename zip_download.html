<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>zipファイルの生成</title>
    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
</head>
<body>
  <button id="downloadZipBtn">ZIPファイルを作成してダウンロード</button>
  <script>
    document.getElementById('downloadZipBtn').addEventListener('click', function() {
    
    //空のzipファイルオブジェクトを生成
    const zip = new JSZip();

    // 1. zipにファイルを追加する、file(ファイル名、中身)
    zip.file("sample.tex", `
    \\documentclass{article}
    \\begin{document}
    これはLaTeXファイルです。
    \\end{document}
    `.trim());
    zip.file("info.txt", "これはLaTeXファイルの説明書です。");

    // 2. zipを生成する
    //zipファイル生成を非同期で行う、blobはブラウザで保存できるファイル
    zip.generateAsync({ type: "blob" })
    //非同期処理の後に実行(今回はzipファイル生成後)、contentにはzipファイルが入る
      .then(function(content) {
        // 3. ブラウザでダウンロードできるようにする
        const link = document.createElement('a');
        link.href = URL.createObjectURL(content);
        link.download = "files.zip"; // ダウンロードファイル名
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(link.href);
      });

    });
  </script>

</body>
</html>
